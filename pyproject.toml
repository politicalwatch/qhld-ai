[project]
name = "qhld-ai"
version = "0.1.0"
description = "QHLD AI"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "pydantic-settings==2.14.2",
    "thefuzz==0.22.1",
    "langchain-core==1.4.8",
    "langchain-anthropic==1.4.8",
    "langchain-openai==1.3.3",
    "langchain-ollama==1.1.0",
    "langchain-google-genai==4.2.6",
    "langchain-mistralai==1.1.5",
    "qhld-data",
    "py3langid==0.3.0",
    "qdrant-client==1.18.0",
    "fastembed==0.8.0",
    "sentence-transformers>=3.3.0",
    "spacy>=3.8,<3.9",
    "es-core-news-lg @ https://github.com/explosion/spacy-models/releases/download/es_core_news_lg-3.8.0/es_core_news_lg-3.8.0-py3-none-any.whl",
    "dateparser>=1.2,<2",
    "langchain-cohere>=0.6.0",
    "langchain-voyageai>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# es-core-news-lg is a direct URL reference (spaCy model wheel) in project.dependencies.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["qhld_ai"]

[dependency-groups]
dev = [
    "ipdb==0.13.13",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = [
    "unit: no-infra tests; run anywhere with no Mongo/Docker. Filter with `-m unit`.",
]

[tool.uv.sources]
# DEV (TFM speeches branch): qhld-data pinned to the paired
# `feat/parliamentary-speech-analysis` branch (resolvable in the Docker build,
# unlike a local path). Revert to a tag pin before merge.
qhld-data = { git = "https://github.com/politicalwatch/qhld-data.git", branch = "feat/parliamentary-speech-analysis" }

[tool.uv]
package = true
